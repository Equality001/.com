<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth & Equality Platform</title>
    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
    <header class="top-header">
        <!-- Translate Button & Popover Container -->
        <div class="translate-popup-wrapper">
            <button class="translate-trigger-btn" onclick="toggleTranslateMenu()">🌐 Translate</button>
            
            <!-- Google Native Dropdown Popup Container -->
            <div id="custom_translate_menu" class="translate-dropdown-menu">
                <div id="google_translate_element"></div>
            </div>
        </div>

        <h1 class="single-line-title">Truth & Equality</h1>
        
        <div class="slogan-container">
            <p class="slogan-en">" Despite our many differences, through humanity we unite — together creating a world where everyone can live with peace, dignity, and happiness. "</p>
        </div>

        <nav>
            <a href="index.html">Home</a> | 
            <a href="services.html">Services</a> | 
            <a href="workers.html">Workers</a> | 
            <a href="shops.html">Shops</a> | 
            <a href="blog.html">Blog</a> | 
            <a href="about.html">About Us</a> | 
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main style="text-align: center; padding: 50px 20px;">
        <h1 style="color: #d4af37; font-family: 'Cinzel', serif;">WELCOME</h1>
        <p style="font-size: 18px; font-family: 'Playfair Display', serif;">Welcome to Truth & Equality Social Enterprise Platform.</p>
    </main>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function toggleTranslateMenu() {
            var menu = document.getElementById('custom_translate_menu');
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'block';
            }
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            var wrapper = document.querySelector('.translate-popup-wrapper');
            if (wrapper && !wrapper.contains(event.target)) {
                document.getElementById('custom_translate_menu').style.display = 'none';
            }
        });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
